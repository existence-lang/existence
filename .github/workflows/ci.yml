name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt -- --check

  export-validate:
    name: RDF export validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install raptor (rapper)
        run: sudo apt-get update && sudo apt-get install -y raptor2-utils

      - name: Fetch the reference ontology
        run: git clone --depth 1 https://github.com/existence-lang/ontology ontology

      - name: Export Turtle and JSON-LD
        run: |
          cargo run --quiet --bin existence -- --ontology ontology export --format turtle > ontology.ttl
          cargo run --quiet --bin existence -- --ontology ontology export --format jsonld > ontology.jsonld

      - name: Validate Turtle parses
        run: rapper -i turtle -c ontology.ttl

      - name: Validate JSON-LD shape
        run: |
          python3 -c "import json; d=json.load(open('ontology.jsonld')); assert d['@context'] and d['@graph'], 'missing @context/@graph'; print(len(d['@graph']), 'graph nodes')"

  install-smoke:
    name: Installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install.sh (latest release)
        if: runner.os != 'Windows'
        run: |
          export EXISTENCE_INSTALL_DIR="$RUNNER_TEMP/existence-bin"
          sh ./install.sh
          "$EXISTENCE_INSTALL_DIR/existence" --version
          "$EXISTENCE_INSTALL_DIR/xist" --version

      - name: install.sh under Git Bash (latest release)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export EXISTENCE_INSTALL_DIR="$RUNNER_TEMP/existence-bin"
          sh ./install.sh
          "$EXISTENCE_INSTALL_DIR/existence.exe" --version

      - name: install.ps1 (latest release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EXISTENCE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'existence-bin-ps'
          ./install.ps1
          & (Join-Path $env:EXISTENCE_INSTALL_DIR 'existence.exe') --version
