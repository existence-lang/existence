name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt -- --check

  install-smoke:
    name: Installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXISTENCE_INSTALL_DIR: ${{ runner.temp }}/existence-bin
    steps:
      - uses: actions/checkout@v4

      - name: install.sh (latest release)
        if: runner.os != 'Windows'
        run: |
          sh ./install.sh
          "$EXISTENCE_INSTALL_DIR/existence" --version
          "$EXISTENCE_INSTALL_DIR/xist" --version

      - name: install.sh under Git Bash (latest release)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sh ./install.sh
          "$EXISTENCE_INSTALL_DIR/existence.exe" --version

      - name: install.ps1 (latest release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EXISTENCE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'existence-bin-ps'
          ./install.ps1
          & (Join-Path $env:EXISTENCE_INSTALL_DIR 'existence.exe') --version
