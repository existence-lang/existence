name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand to publish every tagged version crates.io is missing. Tags are
  # normally published as they are pushed, but a spell of rejected credentials
  # leaves a hole that no single re-run closes: four versions were tagged and
  # released on GitHub while crates.io stayed on 0.7.0, and each one would have
  # needed its own re-run of its own old workflow.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}
        env:
          CROSS_CONTAINER_ENGINE: docker

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: tar czf existence-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release existence xist

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/existence.exe, target/${{ matrix.target }}/release/xist.exe -DestinationPath existence-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: existence-${{ matrix.target }}
          path: existence-${{ matrix.target }}.*

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading assets only"
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" \
              --title "existence $tag" \
              --generate-notes \
              artifacts/*
          fi

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: .github/scripts/publish-crate.sh "${GITHUB_REF_NAME#v}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The tag-driven job above only ever sees the tag being pushed, so fixing a
  # rejected token publishes the NEXT release and leaves the skipped ones behind.
  # This walks every tag in version order and publishes the ones crates.io does
  # not have; the already-there check makes re-running it free.
  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish every version crates.io is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Older tags predate this script, so keep a copy outside the worktree.
          publish="$RUNNER_TEMP/publish-crate.sh"
          cp .github/scripts/publish-crate.sh "$publish"
          for tag in $(git tag --list 'v*' --sort=version:refname); do
            echo "::group::$tag"
            git checkout --quiet --detach "$tag"
            "$publish" "${tag#v}"
            echo "::endgroup::"
          done
