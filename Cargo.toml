[package]
name = "existence"
version = "0.5.0"
edition = "2024"
description = "CLI for the Existence ontology framework"
license = "Apache-2.0"
repository = "https://github.com/existence-lang/existence"
homepage = "https://github.com/existence-lang/existence"
readme = "README.md"
keywords = ["ontology", "cli", "knowledge-graph", "domain-modeling"]
categories = ["command-line-utilities"]

[lib]
name = "existence"
path = "src/lib.rs"

[[bin]]
name = "existence"
path = "src/main.rs"

[[bin]]
name = "xist"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
oxigraph = { version = "0.5", default-features = false, optional = true }
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# `existence sparql` and the SPARQL endpoint of `existence serve`
sparql = ["dep:oxigraph", "dep:tiny_http"]
